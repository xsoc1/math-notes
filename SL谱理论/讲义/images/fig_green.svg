<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" role="img" aria-labelledby="title desc">
	<title id="title">Dirichlet Green 核的固定源点截面</title>
	<desc id="desc">区间零到一, 源点 t 固定. Green 核在 t 左侧斜率为一减 t, 右侧斜率为负 t, 导数跳量为负一.</desc>
	<rect width="640" height="310" rx="12" fill="#fff"/>
	<g font-family="sans-serif" fill="#27344b">
		<text x="320" y="32" font-size="19" text-anchor="middle">−u″ = f, u(0) = u(1) = 0</text>
		<text x="320" y="61" font-size="16" text-anchor="middle">G(x,t) = min(x,t) [1 − max(x,t)]</text>
		<path d="M65 240H580M65 240V82" stroke="#64748b" stroke-width="1.5"/>
		<path d="M574 236l7 4-7 4M61 88l4-7 4 7" fill="none" stroke="#64748b"/>
		<path d="M65 240L250 114L550 240" fill="none" stroke="#287eab" stroke-width="3"/>
		<path d="M250 114V240" stroke="#a4afc0" stroke-dasharray="5 4"/>
		<circle cx="250" cy="114" r="4" fill="#287eab"/>
		<text x="58" y="263" font-size="16">0</text>
		<text x="245" y="263" font-size="16">t</text>
		<text x="545" y="263" font-size="16">1</text>
		<text x="589" y="245" font-size="16">x</text>
		<text x="104" y="148" font-size="16">斜率 1 − t</text>
		<text x="380" y="155" font-size="16">斜率 −t</text>
		<text x="320" y="294" font-size="16" text-anchor="middle">连续的折线核; ∂ₓG(t+,t) − ∂ₓG(t−,t) = −1</text>
	</g>
</svg>
