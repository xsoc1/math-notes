</marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="60" y="60" width="500" height="240" rx="12" fill="#eef4fb" stroke="#1f77b4" stroke-width="2"/>
<text x="292.0" y="186.0" font-family="serif" font-size="18" fill="#1f77b4" text-anchor="middle">H^1</text>
<rect x="110" y="95" width="400" height="180" rx="12" fill="#eefaf0" stroke="#2ca02c" stroke-width="2"/>
